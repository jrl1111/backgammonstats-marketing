<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #fafbff; }
  .card {
    width: 1200px; height: 630px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at top left, rgba(59,130,246,0.18), transparent 60%),
      radial-gradient(ellipse at top right, rgba(14,165,233,0.15), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(99,102,241,0.12), transparent 60%),
      linear-gradient(180deg, #fafbff 0%, #f4f6fc 100%);
  }
  /* Backgammon points pattern — subtle */
  .points {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='240' viewBox='0 0 120 240'><polygon points='0,0 60,0 30,180' fill='%233b82f6' fill-opacity='0.06'/><polygon points='60,0 120,0 90,180' fill='%230ea5e9' fill-opacity='0.055'/><polygon points='0,240 60,240 30,60' fill='%236366f1' fill-opacity='0.055'/><polygon points='60,240 120,240 90,60' fill='%233b82f6' fill-opacity='0.06'/></svg>");
    background-size: 240px 480px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
  }
  .inner {
    position: relative; z-index: 2;
    padding: 70px 80px;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top { display: flex; align-items: center; gap: 18px; }
  .logo-svg { width: 56px; height: 56px; }
  .wordmark { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; color: #0f172a; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.25);
    color: #3b82f6;
    font-size: 16px; font-weight: 700;
    border-radius: 100px;
    padding: 8px 18px;
    margin-bottom: 28px;
    width: fit-content;
  }
  .eyebrow .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 12px #3b82f6;
  }
  h1 {
    font-size: 96px;
    font-weight: 900;
    letter-spacing: -3.5px;
    line-height: 0.98;
    color: #0f172a;
    margin: 0 0 24px 0;
  }
  .accent {
    background: linear-gradient(135deg, #3b82f6, #0ea5e9, #6366f1);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 26px;
    color: #334155;
    font-weight: 500;
    max-width: 860px;
    line-height: 1.4;
    margin: 0;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .url {
    font-size: 22px;
    color: #3b82f6;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .stats {
    display: flex; gap: 40px;
  }
  .stat-num {
    font-size: 30px;
    font-weight: 900;
    color: #0f172a;
    line-height: 1;
  }
  .stat-label {
    font-size: 13px;
    color: #64748b;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="points"></div>
  <div class="inner">
    <div>
      <div class="top">
        <svg class="logo-svg" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#6366f1" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="6" r="5" fill="url(#g)" />
          <circle cx="16" cy="16" r="5" fill="url(#g)" fill-opacity="0.85" />
          <circle cx="16" cy="26" r="5" fill="url(#g)" fill-opacity="0.7" />
        </svg>
        <div class="wordmark">BackgammonStats</div>
      </div>
    </div>

    <div>
      <div class="eyebrow">
        <span class="dot"></span>
        Coming soon
      </div>
      <h1>Play sharper.<br/><span class="accent">Win more.</span></h1>
      <p class="sub">Analytics for backgammon players — online and over-the-board.</p>
    </div>

    <div class="footer">
      <div class="stats">
        <div>
          <div class="stat-num">35+</div>
          <div class="stat-label">Interactive Charts</div>
        </div>
        <div>
          <div class="stat-num">6</div>
          <div class="stat-label">Skill Tiers</div>
        </div>
        <div>
          <div class="stat-num">∞</div>
          <div class="stat-label">Your Matches</div>
        </div>
      </div>
      <div class="url">backgammonstats.com</div>
    </div>
  </div>
</div>
</body>
</html>
